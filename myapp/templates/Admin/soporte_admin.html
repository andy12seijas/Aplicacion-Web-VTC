<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleFibra x VTConexiones - Reportar Pago</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --orange: #ff6b00;
            --orange-dark: #e05a00;
            --orange-light: #fff2e6;
            --gray-bg: #f8f9fa;
            --gray-border: #e0e0e0;
            --gray-text: #666;
            --dark-text: #333;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        
        .card-modern {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .card-header-modern {
            background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .logo-section {
            margin-bottom: 20px;
        }
        
        .logo-icon {
            font-size: 60px;
            color: white;
            margin-bottom: 10px;
        }
        
        .title-main {
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }
        
        .title-sub {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .card-body-modern {
            padding: 40px;
        }
        
        .form-group-modern {
            margin-bottom: 25px;
        }
        
        .form-label-modern {
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 8px;
            font-size: 14px;
            display: block;
        }
        
        .form-control-modern {
            width: 100%;
            border: 2px solid var(--gray-border);
            border-radius: 12px;
            padding: 12px 15px;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .form-control-modern:focus {
            border-color: var(--orange);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.1);
        }
        
        .btn-primary-modern {
            background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 600;
            font-size: 16px;
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-primary-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 0, 0.4);
        }
        
        .btn-secondary-modern {
            background: white;
            border: 2px solid var(--gray-border);
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .btn-secondary-modern:hover {
            border-color: var(--orange);
            color: var(--orange);
        }
        
        /* Modal styles */
        .modal-content-modern {
            border-radius: 20px;
            border: none;
        }
        
        .modal-header-modern {
            background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
            color: white;
            border-radius: 20px 20px 0 0;
            padding: 20px;
        }
        
        .btn-close-white {
            filter: brightness(0) invert(1);
        }
        
        .method-card {
            border: 2px solid var(--gray-border);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .method-card:hover {
            border-color: var(--orange);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .method-card.selected {
            border-color: var(--orange);
            background: var(--orange-light);
        }
        
        .method-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        
        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }
        
        .step {
            flex: 1;
            text-align: center;
            position: relative;
            z-index: 1;
        }
        
        .step-circle {
            width: 40px;
            height: 40px;
            background: var(--gray-border);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
        }
        
        .step.active .step-circle {
            background: var(--orange);
        }
        
        .step.completed .step-circle {
            background: #10b981;
        }
        
        .step-label {
            font-size: 12px;
            margin-top: 8px;
            color: var(--gray-text);
        }
        
        .step.active .step-label {
            color: var(--orange);
            font-weight: bold;
        }
        
        .info-card {
            background: var(--orange-light);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--orange);
        }
        
        .info-label {
            font-size: 12px;
            color: var(--gray-text);
        }
        
        .info-value {
            font-weight: bold;
            color: var(--orange);
            font-size: 16px;
        }
        
        @media (max-width: 768px) {
            .card-body-modern {
                padding: 20px;
            }
            
            .title-main {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card-modern">
                    <div class="card-header-modern">
                        <div class="logo-section">
                            <i class="fas fa-wifi logo-icon"></i>
                            <h1 class="title-main">SimpleFibra x VTConexiones</h1>
                            <p class="title-sub">Reporte de Pagos en Línea</p>
                        </div>
                    </div>
                    
                    <div class="card-body-modern">
                        <!-- Step Indicator -->
                        <div class="step-indicator" id="stepIndicator">
                            <div class="step active" id="step1">
                                <div class="step-circle">1</div>
                                <div class="step-label">Identificación</div>
                            </div>
                            <div class="step" id="step2">
                                <div class="step-circle">2</div>
                                <div class="step-label">Datos del Pago</div>
                            </div>
                            <div class="step" id="step3">
                                <div class="step-circle">3</div>
                                <div class="step-label">Confirmación</div>
                            </div>
                        </div>
                        
                        <!-- Step 1: Identificación -->
                        <div id="step1Content">
                            <form id="identificacionForm">
                                {% csrf_token %}
                                <div class="form-group-modern">
                                    <label class="form-label-modern">
                                        <i class="fas fa-id-card"></i> Cédula de Identidad
                                    </label>
                                    <input type="text" name="cedula" class="form-control-modern" id="inputCedula"
                                           placeholder="Ej: V-12345678" required>
                                </div>
                                
                                <div class="form-group-modern">
                                    <label class="form-label-modern">
                                        <i class="fas fa-envelope"></i> Correo Electrónico
                                    </label>
                                    <input type="email" name="correo" class="form-control-modern" id="inputCorreo"
                                           placeholder="usuario@ejemplo.com" required>
                                </div>
                                
                                <button type="submit" class="btn-primary-modern" id="btnBuscarCliente">
                                    <i class="fas fa-search"></i> Buscar Cliente
                                </button>
                            </form>
                        </div>
                        
                        <!-- Step 2: Datos del Pago (hidden inicialmente) -->
                        <div id="step2Content" style="display: none;">
                            <div class="info-card" id="clienteInfo">
                                <div class="info-label">Cliente identificado</div>
                                <div class="info-value" id="clienteNombre"></div>
                                <div class="info-label mt-2">Documento</div>
                                <div class="info-value" id="clienteCedula"></div>
                            </div>
                            
                            <form id="pagoForm">
                                <div class="form-group-modern">
                                    <label class="form-label-modern">
                                        <i class="fas fa-money-bill-wave"></i> Monto (Bs)
                                    </label>
                                    <input type="number" name="monto" class="form-control-modern" id="inputMonto"
                                           step="0.01" placeholder="0.00" required>
                                </div>
                                
                                <div class="form-group-modern">
                                    <label class="form-label-modern">
                                        <i class="fas fa-calendar"></i> Fecha del Pago
                                    </label>
                                    <input type="date" name="fecha_pago" class="form-control-modern" id="inputFechaPago" required>
                                </div>
                                
                                <div class="form-group-modern">
                                    <label class="form-label-modern">
                                        <i class="fas fa-credit-card"></i> Método de Pago
                                    </label>
                                    <div class="row">
                                        <div class="col-6">
                                            <div class="method-card" onclick="selectMethod('movil')" id="methodMovil">
                                                <i class="fas fa-mobile-alt method-icon" style="color: var(--orange);"></i>
                                                <h6>Pago Móvil</h6>
                                            </div>
                                        </div>
                                        <div class="col-6">
                                            <div class="method-card" onclick="selectMethod('transferencia')" id="methodTransferencia">
                                                <i class="fas fa-university method-icon" style="color: var(--orange);"></i>
                                                <h6>Transferencia</h6>
                                            </div>
                                        </div>
                                    </div>
                                    <input type="hidden" name="medio_pago" id="medioPago" required>
                                </div>
                                
                                <div class="form-group-modern">
                                    <label class="form-label-modern">
                                        <i class="fas fa-comment"></i> Observaciones (opcional)
                                    </label>
                                    <textarea name="observacion_cliente" class="form-control-modern" id="inputObservacion"
                                              rows="3" placeholder="Notas adicionales..."></textarea>
                                </div>
                                
                                <div class="form-group-modern">
                                    <label class="form-label-modern">
                                        <i class="fas fa-image"></i> Comprobante de Pago
                                    </label>
                                    <input type="file" name="comprobante" class="form-control-modern" id="inputComprobante" accept="image/*" required>
                                    <small class="text-muted">Formato: JPG, PNG (máx 5MB)</small>
                                </div>
                                
                                <button type="button" class="btn-primary-modern" onclick="showPaymentDetails()">
                                    <i class="fas fa-arrow-right"></i> Continuar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Pago Móvil -->
    <div class="modal fade" id="modalPagoMovil" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-modern">
                <div class="modal-header modal-header-modern">
                    <h5 class="modal-title"><i class="fas fa-mobile-alt"></i> Detalles Pago Móvil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="padding: 30px;">
                    <form id="pagoMovilForm">
                        <div class="form-group-modern">
                            <label>Banco Emisor (desde donde pagas)</label>
                            <select name="banco_emisor" class="form-control-modern" required>
                                <option value="">Seleccione...</option>
                                {% for banco in bancos %}
                                <option value="{{ banco.id }}">{{ banco.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group-modern">
                            <label>Banco Receptor (nuestro banco)</label>
                            <select name="banco_receptor" class="form-control-modern" required>
                                <option value="">Seleccione...</option>
                                {% for banco in bancos %}
                                <option value="{{ banco.id }}">{{ banco.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group-modern">
                            <label>Número de Teléfono</label>
                            <input type="text" name="numero_telefono" class="form-control-modern" placeholder="+58 412-1234567" required>
                        </div>
                        <div class="form-group-modern">
                            <label>Cédula del Titular</label>
                            <input type="text" name="cedula_titular" class="form-control-modern" placeholder="V-12345678" required>
                        </div>
                        <div class="form-group-modern">
                            <label>Número de Referencia</label>
                            <input type="text" name="referencia" class="form-control-modern" placeholder="Ej: 1234567890" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary-modern" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-primary-modern" onclick="submitPagoMovil()">Enviar Pago</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Transferencia -->
    <div class="modal fade" id="modalTransferencia" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-content-modern">
                <div class="modal-header modal-header-modern">
                    <h5 class="modal-title"><i class="fas fa-university"></i> Detalles Transferencia</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="padding: 30px;">
                    <form id="transferenciaForm">
                        <div class="form-group-modern">
                            <label>Banco de Origen</label>
                            <select name="banco_origen" class="form-control-modern" required>
                                <option value="">Seleccione...</option>
                                {% for banco in bancos %}
                                <option value="{{ banco.id }}">{{ banco.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group-modern">
                            <label>Banco de Destino</label>
                            <select name="banco_destino" class="form-control-modern" required>
                                <option value="">Seleccione...</option>
                                {% for banco in bancos %}
                                <option value="{{ banco.id }}">{{ banco.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="form-group-modern">
                            <label>Cédula del Titular</label>
                            <input type="text" name="cedula_titular" class="form-control-modern" placeholder="V-12345678" required>
                        </div>
                        <div class="form-group-modern">
                            <label>Número de Cuenta Origen (opcional)</label>
                            <input type="text" name="numero_cuenta_origen" class="form-control-modern" placeholder="Cuenta bancaria">
                        </div>
                        <div class="form-group-modern">
                            <label>Número de Referencia</label>
                            <input type="text" name="referencia" class="form-control-modern" placeholder="Ej: 1234567890" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary-modern" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-primary-modern" onclick="submitTransferencia()">Enviar Pago</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Registro Cliente Nuevo -->
    <div class="modal fade" id="modalRegistroCliente" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content modal-content-modern">
                <div class="modal-header modal-header-modern">
                    <h5 class="modal-title"><i class="fas fa-user-plus"></i> Registro de Nuevo Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" style="padding: 30px;">
                    <form id="registroClienteForm">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group-modern">
                                    <label>Cédula</label>
                                    <input type="text" name="cedula" class="form-control-modern" id="regCedula" readonly required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group-modern">
                                    <label>Correo</label>
                                    <input type="email" name="correo" class="form-control-modern" id="regCorreo" readonly required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group-modern">
                                    <label>Nombre</label>
                                    <input type="text" name="nombre" class="form-control-modern" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group-modern">
                                    <label>Apellido</label>
                                    <input type="text" name="apellido" class="form-control-modern" required>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group-modern">
                                    <label>Teléfono</label>
                                    <input type="text" name="telefono" class="form-control-modern" required>
                                </div>
                            </div>
                            <div class="col-md-12">
                                <div class="form-group-modern">
                                    <label>Dirección</label>
                                    <textarea name="direccion" class="form-control-modern" rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary-modern" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn-primary-modern" onclick="registrarCliente()">Registrar</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentCliente = null;
        let currentTipoPago = null;
        
        // Identificación de cliente - CORREGIDO
        document.getElementById('identificacionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const cedula = document.getElementById('inputCedula').value;
            const correo = document.getElementById('inputCorreo').value;
            
            // Mostrar loading
            const btn = document.getElementById('btnBuscarCliente');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Buscando...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/pagos/buscar-cliente/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name="csrfmiddlewaretoken"]').value
                    },
                    body: JSON.stringify({ cedula, correo })
                });
                
                const data = await response.json();
                
                if (data.exists) {
                    // Cliente existe
                    currentCliente = data.cliente;
                    document.getElementById('clienteNombre').innerText = data.cliente.nombre_completo;
                    document.getElementById('clienteCedula').innerText = data.cliente.cedula;
                    
                    // Mostrar step 2
                    document.getElementById('step1Content').style.display = 'none';
                    document.getElementById('step2Content').style.display = 'block';
                    
                    // Actualizar step indicator
                    document.getElementById('step1').classList.remove('active');
                    document.getElementById('step1').classList.add('completed');
                    document.getElementById('step2').classList.add('active');
                } else {
                    // Cliente no existe, mostrar modal de registro
                    document.getElementById('regCedula').value = cedula;
                    document.getElementById('regCorreo').value = correo;
                    const modal = new bootstrap.Modal(document.getElementById('modalRegistroCliente'));
                    modal.show();
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire('Error', 'Error al buscar el cliente. Intente nuevamente.', 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
        
        function selectMethod(method) {
            currentTipoPago = method;
            document.getElementById('medioPago').value = method === 'movil' ? 'PAGO_MOVIL' : 'TRANSFERENCIA';
            
            // Reset selected styles
            document.getElementById('methodMovil').classList.remove('selected');
            document.getElementById('methodTransferencia').classList.remove('selected');
            
            // Add selected style
            if (method === 'movil') {
                document.getElementById('methodMovil').classList.add('selected');
            } else {
                document.getElementById('methodTransferencia').classList.add('selected');
            }
        }
        
        function showPaymentDetails() {
            const medioPago = document.getElementById('medioPago').value;
            const monto = document.getElementById('inputMonto').value;
            const fechaPago = document.getElementById('inputFechaPago').value;
            const comprobante = document.getElementById('inputComprobante').files[0];
            
            if (!medioPago) {
                Swal.fire('Error', 'Por favor seleccione un método de pago', 'error');
                return;
            }
            
            if (!monto || monto <= 0) {
                Swal.fire('Error', 'Por favor ingrese un monto válido', 'error');
                return;
            }
            
            if (!fechaPago) {
                Swal.fire('Error', 'Por favor seleccione la fecha del pago', 'error');
                return;
            }
            
            if (!comprobante) {
                Swal.fire('Error', 'Por favor seleccione el comprobante de pago', 'error');
                return;
            }
            
            if (medioPago === 'PAGO_MOVIL') {
                new bootstrap.Modal(document.getElementById('modalPagoMovil')).show();
            } else {
                new bootstrap.Modal(document.getElementById('modalTransferencia')).show();
            }
        }
        
        async function submitPagoMovil() {
            const form = document.getElementById('pagoMovilForm');
            const formData = new FormData();
            
            // Datos del reporte
            formData.append('medio_pago', 'PAGO_MOVIL');
            formData.append('monto', document.getElementById('inputMonto').value);
            formData.append('fecha_pago', document.getElementById('inputFechaPago').value);
            formData.append('observacion_cliente', document.getElementById('inputObservacion').value);
            formData.append('comprobante', document.getElementById('inputComprobante').files[0]);
            
            // Datos del cliente
            formData.append('tipo_cliente', currentCliente.tipo);
            if (currentCliente.tipo === 'INTERNO') {
                formData.append('contrato_id', currentCliente.id);
            } else {
                formData.append('cliente_externo_id', currentCliente.id);
            }
            
            // Datos de pago móvil
            formData.append('banco_emisor', form.querySelector('[name="banco_emisor"]').value);
            formData.append('banco_receptor', form.querySelector('[name="banco_receptor"]').value);
            formData.append('numero_telefono', form.querySelector('[name="numero_telefono"]').value);
            formData.append('cedula_titular', form.querySelector('[name="cedula_titular"]').value);
            formData.append('referencia', form.querySelector('[name="referencia"]').value);
            
            const response = await fetch('/pagos/crear-reporte/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('[name="csrfmiddlewaretoken"]').value
                },

        async function submitTransferencia() {
            const form = document.getElementById('transferenciaForm');
            const formData = new FormData();
            
            // Datos del reporte
            formData.append('medio_pago', 'TRANSFERENCIA');
            formData.append('monto', document.getElementById('inputMonto').value);
            formData.append('fecha_pago', document.getElementById('inputFechaPago').value);
            formData.append('observacion_cliente', document.getElementById('inputObservacion').value);
            formData.append('comprobante', document.getElementById('inputComprobante').files[0]);
            
            // Datos del cliente
            formData.append('tipo_cliente', currentCliente.tipo);
            if (currentCliente.tipo === 'INTERNO') {
                formData.append('contrato_id', currentCliente.id);
            } else {
                formData.append('cliente_externo_id', currentCliente.id);
            }
            
            // Datos de transferencia
            formData.append('banco_origen', form.querySelector('[name="banco_origen"]').value);
            formData.append('banco_destino', form.querySelector('[name="banco_destino"]').value);
            formData.append('cedula_titular', form.querySelector('[name="cedula_titular"]').value);
            formData.append('numero_cuenta_origen', form.querySelector('[name="numero_cuenta_origen"]').value);
            formData.append('referencia', form.querySelector('[name="referencia"]').value);
            
            const response = await fetch('/pagos/crear-reporte/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('[name="csrfmiddlewaretoken"]').value
                },
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                Swal.fire('Éxito', 'Su pago ha sido reportado correctamente', 'success').then(() => {
                    window.location.href = '/pagos/exito/';
                });
            } else {
                Swal.fire('Error', data.error || 'Ocurrió un error', 'error');
            }
        }
        
        async function registrarCliente() {
            const form = document.getElementById('registroClienteForm');
            const formData = new FormData(form);
            
            const response = await fetch('/pagos/registrar-cliente-externo/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('[name="csrfmiddlewaretoken"]').value
                },
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                currentCliente = {
                    tipo: 'EXTERNO',
                    id: data.cliente_id,
                    cedula: formData.get('cedula'),
                    nombre_completo: formData.get('nombre') + ' ' + formData.get('apellido')
                };
                
                bootstrap.Modal.getInstance(document.getElementById('modalRegistroCliente')).hide();
                
                document.getElementById('clienteNombre').innerText = currentCliente.nombre_completo;
                document.getElementById('clienteCedula').innerText = currentCliente.cedula;
                
                document.getElementById('step1Content').style.display = 'none';
                document.getElementById('step2Content').style.display = 'block';
                
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step1').classList.add('completed');
                document.getElementById('step2').classList.add('active');
                
                Swal.fire('Registro exitoso', 'Cliente registrado correctamente', 'success');
            } else {
                Swal.fire('Error', data.error || 'Error al registrar cliente', 'error');
            }
        }
        
        // Función para obtener CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
